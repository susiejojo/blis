# Configuration for function minimization example
max_iterations: 10
checkpoint_interval: 5

# LLM configuration
llm:
  # primary_model: "gemini-2.5-flash-lite"
  # # primary_model: "gpt-5-mini"
  # # primary_model: "llama3.1-8b"
  # primary_model_weight: 0.8
  # secondary_model: "gemini-2.5-flash"
  # # secondary_model: "llama-4-scout-17b-16e-instruct"
  # # secondary_model: "gpt-5-nano"
  # secondary_model_weight: 0.2
  # primary_model: "gemini-2.5-flash"
  primary_model: Azure/gpt-4.1-mini #GCP/claude-opus-4
  primary_model_weight: 1
  # api_base: "https://generativelanguage.googleapis.com/v1beta/openai/"
  # api_base: "https://api.cerebras.ai/v1"
  # api_base: "https://api.openai.com/v1"
  api_base: https://ete-litellm.ai-models.vpc-int.res.ibm.com
  additional_drop_params:
    - top_p
  temperature: 1
  max_tokens: 16000
  timeout: 120
  # top_p: null 

# Prompt configuration
prompt:
  system_message: >
    You are an expert systems programmer optimizing a Python request router for LLM inference.

    Goal: minimize end-to-end latency (equivalently maximize the evaluator's combined_score = -avg_latency).
    Prioritize simple, stable improvements that generalize.

    Router behavior (do not change external interfaces):
      - Tokenize req.input
      - Hash tokens into KV blocks
      - Score pods based on overlap between request blocks and each pod's KV cache
      - Route each request to one pod
      - Update ONLY the chosen pod's KV cache AFTER routing

    What you MAY change:
      - How pods are scored (e.g., prefix-weighted overlap vs. pure longest-prefix)
      - Tie-breaking rules
      - Add lightweight load-awareness using only information available inside the router
      - Use smooth penalties/weights (e.g., proportional to overlap fraction, cache size, or recent assignments)

    Critical constraints (must follow):
      - DO NOT add hardcoded thresholds or fixed cutoffs (e.g., "if score >= 2", "if prefix >= 4", etc.).
        Any decision rule must be scale-free and continuous (ratios, normalized scores, soft penalties).
      - DO NOT add a second pass that revisits/overrides earlier routing decisions.
        Routing must be single-pass, online, sequential.
      - DO NOT introduce randomness (router must be deterministic).
      - Keep runtime overhead low; avoid O(num_reqs^2) patterns such as recomputing pod_loads by scanning policy each step.
      - Only edit code inside the EVOLVE-BLOCK.

    Guidance:
      - Prefer a combined score like:
          combined = prefix_weighted_overlap - small_load_penalty
        where overlap is normalized (e.g., matched_blocks / total_blocks), and load_penalty is normalized (e.g., assigned_so_far / seen_so_far).
      - Use deterministic tie-breaks that reduce hotspots without destroying locality.

    Output:
      - Return only the updated code for the EVOLVE-BLOCK with minimal diffs.
      - Do not add new global state or change function signatures.


  # system_message: >
  #   You are an expert systems programmer.

  #   Your task is to improve a routing algorithm that assigns requests
  #   to multiple simulator instances.

  #   The algorithm receives a list of requests and must decide which
  #   simulator each request should be routed to.

  #   The goal is to maximize the average reward returned by the simulators.

  #   Good routing solutions often balance load while preserving request
  #   locality (e.g., requests with shared prefixes in request.input can
  #   benefit from being routed to the same simulator instance).
  #   Hint: consider the first few blocks of request.input when reasoning
  #   about prefixes (a block is often 16 tokens).

  #   Focus only on improving the routing logic. 
  #   Do not change the evaluator or any external code.

# system_message: >
#   You are an expert systems programmer specializing in request routing,
#   caching, and load balancing for distributed inference systems.

#   Your task is to design and iteratively improve a routing algorithm that
#   assigns inference requests to multiple simulator instances.

#   Each request has the following structure:
#     - arrival_time: float
#     - input: str
#     - output: str

#   The router receives a sequence of requests and must return, for each request,
#   the simulator ID (0 to num_sims - 1) to which it is routed.

#   Objective:
#     The simulator returns a reward equal to the negative of request latency.
#     Therefore, your goal is to minimize the average latency across all requests
#     (equivalently, maximize the average reward).

#   Important properties of the workload:
#     - Requests may share partial prefixes in their input strings.
#     - A prefix is defined as shared leading words, not necessarily identical
#       full input strings.
#     - Routing requests with overlapping prefixes to the same simulator can
#       improve latency due to state reuse or caching effects.
#     - However, routing too many requests to the same simulator can increase
#       latency due to load imbalance.

#   Design considerations:
#     - Prefer locality-aware routing that exploits shared input prefixes.
#     - Do not rely solely on exact input equality or full-string hashing.
#     - Balance prefix locality with load balancing across simulators.
#     - Routing decisions may depend on earlier requests in the same batch.
#     - The algorithm should generalize beyond trivial or static routing schemes.

#   Constraints:
#     - Modify only the routing logic.
#     - Do NOT change the evaluator, request format, simulator behavior,
#       or any external code.
#     - The router must be deterministic for a given input sequence.

#   Your goal is to discover increasingly effective routing strategies that
#   trade off prefix locality and load balance to minimize latency.

# Database configuration
database:
  population_size: 50
  archive_size: 20
  num_islands: 3
  elite_selection_ratio: 0.1 # 0.2 - This is too greedy for a flat landscape.
  exploitation_ratio: 0.4 # 0.7

  # embedding_model: "text-embedding-3-small"
  similarity_threshold: 0.90 # This allows behaviorally similar but structurally different routers to coexist long enough to mutate into something better.

# Evaluator configuration
evaluator:
  timeout: 60
  cascade_thresholds: [1.3]
  parallel_evaluations: 3

# Evolution settings
diff_based_evolution: true
max_code_length: 20000